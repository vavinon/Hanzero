    <!-- SPA Route Restoration with Red Team Anti-Open-Redirect Defense -->
    <script>
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&');
          }).join('?');

          // Red Team Defense:
          // 1. Must start with '/'
          // 2. Must not start with '//' (prevent protocol-relative open redirects)
          // 3. Must not contain ':' (prevent javascript:, data:, http:)
          // 4. Must not contain '\\' (prevent backslash bypass)
          if (decoded.startsWith('/') && !decoded.startsWith('//') && !decoded.includes(':') && !decoded.includes('\\')) {
            window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + (l.hash || ''));
          } else {
            // Malicious or malformed payload detected: strip query and stay at canonical base
            window.history.replaceState(null, null, l.pathname);
          }
        }
      }(window.location));
    </script>
