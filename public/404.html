<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hanzero 🐰 - กำลังนำทางกลับสู่บทเรียน...</title>
    <script>
      // Single Page Apps redirect handler for GitHub Pages
      // Preserves deep links across client-side SPA routing with anti-phishing defense
      (function() {
        var pathSegmentsToKeep = 1; // 1 for repo path '/Hanzero/'
        var l = window.location;
        var pathname = l.pathname;
        
        // Split path segments
        var segments = pathname.split('/');
        
        // Determine repo base (e.g. '/Hanzero/')
        var repoBase = segments.slice(0, 1 + pathSegmentsToKeep).join('/');
        if (!repoBase.endsWith('/')) {
          repoBase += '/';
        }
        
        // Remaining path segments
        var routePath = segments.slice(1 + pathSegmentsToKeep).join('/');
        if (routePath && !routePath.startsWith('/')) {
          routePath = '/' + routePath;
        }
        
        // Red Team Anti-Phishing Guard:
        // Strip out any attempts to inject protocols, double-slashes, or backslashes
        if (routePath.startsWith('//') || routePath.includes(':') || routePath.includes('\\')) {
          routePath = '';
        }
        
        var query = l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '';
        var destination = repoBase + '?' + routePath + query + (l.hash || '');
        
        l.replace(destination);
      })();
    </script>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Prompt', sans-serif;
        background-color: #FDFBF7;
        color: #1F2937;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        text-align: center;
        padding: 20px;
      }
      .card {
        background: #FFFFFF;
        padding: 32px 24px;
        border-radius: 16px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
        max-width: 400px;
        border: 1px solid #E5E7EB;
      }
      .bunny {
        font-size: 40px;
        margin-bottom: 12px;
        display: inline-block;
        animation: hop 0.8s infinite alternate ease-in-out;
      }
      @keyframes hop {
        from { transform: translateY(0); }
        to { transform: translateY(-8px); }
      }
      h1 { font-size: 18px; margin: 0 0 8px 0; color: #047857; font-weight: 700; }
      p { font-size: 13px; color: #6B7280; margin: 0; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="bunny">🐰</div>
      <h1>กำลังนำทางกลับสู่ Hanzero...</h1>
      <p>ระบบกำลังพาคุณกลับสู่บทเรียน กรุณารอสักครู่</p>
    </div>
  </body>
</html>
